<!doctype html><html lang="fr"><head> <meta charset="UTF-8" /> <link rel="icon" type="image/svg+xml" href="./site/image/logo-min.jpg" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Guide AxenFlow</title> <link rel="stylesheet" href="./site/assets/index-DEyrlZbX.css"></head><body> <div id="root"></div> <div class="flex h-screen"> <nav class="w-1/5 bg-[#1A3836] text-white fixed h-screen top-0 left-0"> <img alt="Logo AxenFlow" class="p-4 pb-6 mb-3 bg-[#00000055]" src="./site/image/logo.png"> <div class="ml-4"> <h2 class="text-xl font-bold mt-4">Guide d'utilisation</h2> <ul class="space-y-2"> <li class="mr-4 hover:bg-[#112423] rounded-xs"> <button class="block w-full text-left p-2 rounded" onclick="showContent(1)">Introduction</button> </li> <li class="mr-4 hover:bg-[#112423] rounded-xs"> <button class="block w-full text-left p-2 rounded" onclick="showContent(2)">Étudiants</button> </li> <li class="mr-4 hover:bg-[#112423] rounded-xs"> <button class="block w-full text-left p-2 rounded" onclick="showContent(3)">Enseignants</button> </li> <li class="mr-4 hover:bg-[#112423] rounded-xs"> <button class="block w-full text-left p-2 rounded" onclick="showContent(4)">Mission</button> </li> <li class="mr-4 hover:bg-[#112423] rounded-xs"> <button class="block w-full text-left p-2 rounded" onclick="showContent(5)">Notes des étudiants</button> </li> <li class="mr-4 hover:bg-[#112423] rounded-xs"> <button class="block w-full text-left p-2 rounded" onclick="showContent(6)">Email</button> </li> </ul> <h2 class="text-xl font-bold mt-4">Licence</h2> <ul class="space-y-2"> <li class="mr-4 hover:bg-[#112423] rounded-xs"> <button class="block w-auto text-left p-2 rounded" onclick="showContent(7)">Licence</button> </li> </ul> </div> <div class="bottom-0 right-0 absolute mb-2 mr-4"> <a href="https://github.com/xen0r-star" target="_blank" rel="noopener noreferrer"> <img alt="logo github" class="w-10 cursor-pointer" src="./site/image/github-mark-white.svg"> </a> </div> </nav> <div id="contentDynamic" class="w-4/5 p-6 bg-gray-100 top-0 right-0 absolute"></div> </div> <script> function showContent(contentNumber) { let content1 = `<div class="p-4 bg-white rounded shadow text-black"> <div class="prose max-w-none"> <h2><strong>Introduction</strong></h2> <p>Le projet se lance depuis le ruban d'options dans la catégorie "AxenFlow". Il comprend 10 boutons répartis en 4 catégories différentes : <strong>Application</strong>, <strong>Gestion des données</strong>, <strong>Email</strong> et <strong>Info et Aide</strong>.</p> <p><img alt="Image AxenFlow" src="././site/image/048.png"></p> <p><strong>Application</strong> contient trois boutons permettant de gérer le programme. <em><strong>Lancer</strong></em> démarre l'application sur le fichier Excel actuel. <em><strong>ReLancer</strong></em> arrête puis relance l'application en cas de problème. <em><strong>Stop</strong></em> permet de stopper et de fermer complètement le programme.</p> <p><strong>Gestion des données</strong> propose quatre boutons pour accéder aux différentes sections de l'application. <em><strong>Étudiants</strong></em> ouvre la page dédiée aux étudiants. <em><strong>Enseignants</strong></em> permet de gérer les enseignants. <em><strong>Missions</strong></em> redirige vers la page des missions. <em><strong>Grille</strong></em> Points offre la possibilité de consulter les grilles de notation.</p> <p><strong>Email</strong> contient un unique bouton, <em><strong>Email</strong></em> qui permet d'accéder à la page d'envoi des e-mails de l'application.</p> <p><strong>Info et Aide</strong> propose deux boutons. <em><strong>Info</strong></em> redirige vers une page contenant des informations complémentaires sur l'application. <em><strong>Aide</strong></em> ouvre le site du projet AxenFlow, où des explications détaillées sur son utilisation sont disponibles.</p> <p>Pour commencer, appuyez sur le bouton Lancer afin de démarrer l'application. Une fois celle-ci en cours d'exécution, l'interface principale s'affiche.</p> <p>Lorsque l'application est lancée, vous arrivez sur une interface structurée en plusieurs parties. Sur la gauche, un menu latéral propose cinq onglets : <em><strong>Eleves</strong></em>, <em><strong>Enseignants</strong></em>, <em><strong>Missions</strong></em>, <em><strong>Notes</strong></em> et <em><strong>Email</strong></em>. En bas de ce menu, trois boutons supplémentaires sont disponibles : <em><strong>Quitter</strong></em> pour fermer l'application, <em><strong>Info</strong></em> qui affiche des renseignements supplémentaires et <em><strong>Aide</strong></em> qui ouvre le site du projet.</p> <p>Sur la droite, une zone d'affichage affiche le contenu de l'onglet sélectionné. En naviguant entre les différentes sections, vous pouvez facilement gérer vos données et effectuer les actions souhaitées.</p> <p><img alt="Image AxenFlow" src="./site/image/049.png"></p> </div></div>`; let content2 = `<div class="p-4 bg-white rounded shadow text-black"> <div class="prose max-w-none"> <h2><strong>Onglet Eleves</strong></h2> <p>Lorsque vous cliquez sur le bouton Eleves dans le menu à gauche, vous verrez le contenu s'afficher à droite. L'interface de l'onglet Eleves est divisée en deux parties : <strong>l'en-tête</strong> et le <strong>corps/contenu</strong>.</p> <p><img alt="Image AxenFlow" src="./site/image/050.png"></p> <hr> <h3><strong>En-tête</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/051.png"></p> <p>L'en-tête de l'onglet Élèves contient plusieurs informations essentielles et options d'interaction avec les données :</p> <ul> <li> <p><strong>Le nombre d'élèves</strong> : Affiche le nombre total d'élèves actuellement enregistrés dans l'application.</p> </li> <li> <p><strong>Le nombre d'éléments sélectionnés</strong> : Indique combien d'élèves ont été sélectionnés via les cases à cocher.</p> </li> <li> <p><strong>Les boutons d'action</strong> :</p> <p><em><strong>Ajouter</strong></em> : Permet d'ajouter un nouvel élève à la fin de la liste des élèves. L'ajout ne modifie que l'application et n'impacte pas les données dans les feuilles Excel, ce qui permet de tester sans modifier la base de données réelle.</p> <p><img alt="Image AxenFlow" src="./site/image/052.png"></p> <p><em><strong>Sauvegarder</strong></em> : Ce bouton permet d'enregistrer toutes les modifications effectuées dans l'application vers les feuilles Excel. Un message de confirmation apparaît avant d'effectuer les changements, afin de vous assurer que vous souhaitez bien enregistrer les données. </p> <p><img alt="Image AxenFlow" src="./site/image/053.png"></p> <p><em><strong>Supprimer</strong></em> : Permet de supprimer les données sélectionnées dans l'application. Pour ce faire, vous devez cocher les cases correspondantes aux éléments à supprimer. Notez que la suppression ne se fait que dans l'application, tant que vous n'avez pas cliqué sur le bouton Sauvegarder. Une fois la sauvegarde effectuée, les suppressions seront appliquées dans les feuilles Excel.</p> <p><img alt="Image AxenFlow" src="./site/image/054.png"></p> </li> </ul> <h3><strong>Corps / Contenu</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/029.png"></p> <p>Le corps de l'onglet Élèves présente plusieurs zones de saisie et d'interaction avec les informations des élèves.</p> <ul> <li> <p><strong>Zones de saisie</strong> :</p> <p><em><strong>Case à cocher</strong></em>: Chaque élève est accompagné d'une case à cocher permettant de sélectionner ou désélectionner un élève pour des actions comme la suppression ou l'envoi d'email. </p> <p><em><strong>Matricule</strong></em> : Le matricule de l'élève.</p> <p><em><strong>Nom</strong></em> : Le nom de l'élève.</p> <p><em><strong>Prénom</strong></em> : Le prénom de l'élève.</p> <p><em><strong>Orientation</strong></em> : L'orientation ou la filière de l'élève.</p> <p><em><strong>Email</strong></em> : L'email de l'élève, sous le format attendu : <a href="mailto:matricule@student.helha.be">matricular@student.helha.be</a>.</p> </li> <li> <p><strong>Barre de défilement</strong> : Une barre de défilement est présente sur le côté pour permettre de faire défiler les différents élèves et consulter les données.</p> </li> </ul> <h3><strong>Vérification des données</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/030.png"></p> <p>L'application vérifie automatiquement la validité des informations saisies dans les champs de matricule et email :</p> <ul> <li><strong>Matricule</strong> : Le matricule doit commencer par "LA" suivi de six chiffres. Si cette règle n'est pas respectée, le texte devient rouge pour vous alerter.</li> <li><strong>Email</strong> : L'email doit suivre le format <a href="mailto:matricule@student.helha.be">matricular@student.helha.be</a>. Si l'email n'est pas conforme, il sera également mis en rouge.</li> </ul> <h3><strong>Sélection de tous les éléments</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/031.png"></p> <p>En haut du corps de la page, juste au-dessus du premier élément de la liste, se trouve une case à cocher supplémentaire. Cette case permet de sélectionner ou de désélectionner tous les élèves présents dans la liste d'un seul coup.</p> </div></div>`; let content3 = `<div class="p-4 bg-white rounded shadow text-black"> <div class="prose max-w-none"> <h2><strong>Onglet Enseignants</strong></h2> <p>Lorsque vous cliquez sur le bouton Enseignants dans le menu à gauche, vous verrez le contenu s'afficher à droite. L'interface de l'onglet Enseignants est divisée en deux parties : l'<strong>en-tête</strong> et le <strong>corps/contenu</strong>.</p> <p><img alt="Image AxenFlow" src="./site/image/058.png"></p> <hr> <h3><strong>En-tête</strong></h3> <p>L'en-tête de l'onglet Enseignants contient plusieurs informations essentielles et options d'interaction avec les données :</p> <p><img alt="Image AxenFlow" src="./site/image/059.png"></p> <ul> <li> <p><strong>Le nombre d'enseignants</strong> : Affiche le nombre total d'enseignants enregistrés dans l'application.</p> </li> <li> <p><strong>Le nombre d'éléments sélectionnés</strong> : Indique combien d'enseignants ont été sélectionnés via les cases à cocher.</p> </li> <li> <p><strong>Les boutons d'action</strong> :</p> <p><em><strong>Ajouter</strong></em> : Permet d'ajouter un nouvel enseignant à la fin de la liste des enseignants. Cet ajout ne modifie que l'application et n'affecte pas les données des feuilles Excel tant qu'elles ne sont pas sauvegardées.</p> <p><img alt="Image AxenFlow" src="./site/image/060.png"></p> <p><em><strong>Sauvegarder</strong></em> : Enregistre toutes les modifications effectuées dans l'application vers les feuilles Excel. Un message de confirmation apparaît avant d'effectuer les changements afin d'éviter toute erreur involontaire.</p> <p><img alt="Image AxenFlow" src="./site/image/061.png"></p> <p><em><strong>Supprimer</strong></em> : Permet de supprimer les enseignants sélectionnés à l'aide des cases à cocher. Comme pour les élèves, la suppression ne se fait que dans l'application tant que le bouton Sauvegarder n'a pas été utilisé. Une fois la sauvegarde effectuée, les suppressions seront appliquées dans les feuilles Excel.</p> <p><img alt="Image AxenFlow" src="./site/image/062.png"></p> </li> </ul> <h3><strong>Corps / Contenu</strong></h3> <p>Le corps de l'onglet Enseignants présente plusieurs zones de saisie et d'interaction avec les informations des enseignants.</p> <p><img alt="Image AxenFlow" src="./site/image/063.png"></p> <ul> <li> <p><strong>Zones de saisie</strong> :</p> <p><em><strong>Case à cocher :</strong></em> Chaque enseignant est accompagné d'une case permettant de le sélectionner pour des actions comme la suppression ou l'envoi d'e-mails.</p> <p><em><strong>Abréviation</strong></em> : L'abréviation de l'enseignants.</p> <p><em><strong>Nom</strong></em> : Le nom de l'enseignant.</p> <p><em><strong>Prénom</strong></em> : Le prénom de l'enseignant.</p> <p><em><strong>Email</strong></em> : L'adresse e-mail de l'enseignant sous le format attendu : <a href="mailto:prenom.nom@helha.be">prenom.nom@helha.be</a>.</p> </li> <li> <p><strong>Barre de défilement</strong> : Une barre de défilement est présente sur le côté pour permettre de faire défiler les différents enseignants et consulter les données.</p> </li> </ul> <h3><strong>Vérification des données</strong></h3> <p>L'application vérifie automatiquement la validité des informations saisies dans les champs de matricule et email :</p> <ul> <li><strong>Abréviation</strong>* : L'abréviation doit respecter un format spécifique. Si ce format n'est pas respecté, le texte devient rouge pour alerter l'utilisateur.</li> <li><strong>Email</strong> : L'email doit suivre la structure <a href="mailto:prenom.nom@helha.be">prenom.nom@helha.be</a>. Si ce format n'est pas respecté, l'application le signalera en affichant le texte en rouge.</li> </ul> <p><img alt="Image AxenFlow" src="./site/image/064.png"></p> <h3><strong>Sélection de tous les éléments</strong></h3> <p>Tout en haut du corps de la page, juste au-dessus du premier élément de la liste, une case à cocher supplémentaire permet de tout sélectionner ou tout désélectionner en un seul clic. Cela facilite les modifications en masse, comme la suppression ou la mise à jour de plusieurs enseignants en même temps.</p> <p><img alt="Image AxenFlow" src="./site/image/065.png"></p> </div></div>`; let content4 = `<div class="p-4 bg-white rounded shadow text-black"> <div class="prose max-w-none"> <h2><strong>Onglet Missions</strong></h2> <p><strong>Cet onglet permet de gérer les missions</strong>. Lorsque vous cliquez sur le bouton Missions dans le menu à gauche, vous verrez le contenu s'afficher à droite. L'interface de l'onglet Missions est divisée en deux parties : l'<strong>en-tête</strong> et le <strong>corps/contenu</strong>.</p> <p><img alt="Image AxenFlow" src="./site/image/001.png"></p> <hr> <h3><strong>En-tête</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/002.png"></p> <p>L'en-tête de l'onglet Missions contient plusieurs informations essentielles et options d'interaction avec les données :</p> <ul> <li> <p><strong>Le nombre de missions</strong> : Affiche le nombre total de missions actuellement enregistrées dans l'application.</p> </li> <li> <p><strong>Le nombre d'éléments sélectionnés</strong> : Indique combien de missions ont été sélectionnées via les cases à cocher.</p> </li> <li> <p><strong>Les boutons d'action</strong> :</p> <p><em><strong>Ajouter</strong></em> : Permet d'ajouter une nouvelle mission à la fin de la liste. Comme pour les autres onglets, l'ajout ne modifie que l'application et n'a aucun impact sur les données des feuilles Excel tant qu'elles ne sont pas sauvegardées.</p> <p><img alt="Image AxenFlow" src="./site/image/003.png"></p> <p><em><strong>Sauvegarder</strong></em> : Enregistre toutes les modifications effectuées dans l'application vers les feuilles Excel. Un message de confirmation s'affiche avant l'enregistrement pour éviter toute erreur accidentelle.</p> <p><img alt="Image AxenFlow" src="./site/image/004.png"></p> <p><em><strong>Supprimer</strong></em> : Supprime les missions sélectionnées à l'aide des cases à cocher. La suppression est uniquement appliquée dans l'application tant que le bouton Sauvegarder n'a pas été utilisé. Une fois la sauvegarde effectuée, les suppressions seront appliquées aux feuilles Excel.</p> <p><img alt="Image AxenFlow" src="./site/image/005.png"></p> </li> </ul> <h3><strong>Corps / Contenu</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/006.png"></p> <p>Le corps de l'onglet Missions présente plusieurs champs pour organiser et afficher les informations des missions assignées aux enseignants et aux élèves.</p> <ul> <li> <p><strong>Zones de saisie :</strong></p> <p><em><strong>Case à cocher</strong></em> : Chaque mission est accompagnée d'une case permettant de la sélectionner pour des actions comme la suppression.</p> <p><em><strong>Abréviation</strong></em> : Une abréviation spécifique identifiant l'enseignant.</p> <p><em><strong>Nom</strong></em> : Nom complet de l'enseignant.</p> <p><em><strong>Prénom</strong></em> : Prénom de l'enseignant.</p> <p><em><strong>Orientation</strong></em> : La section où l'enseignant doit effectuer sa mission.</p> <p><em><strong>Mission</strong></em> : Description ou intitulé de la mission attribuée.</p> </li> <li> <p><strong>Barre de défilement</strong> : Une barre de défilement est disponible sur le côté pour naviguer facilement entre les différentes missions, surtout si la liste est longue.</p> </li> </ul> <h3><strong>Vérification des données</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/007.png"></p> <p>L'application vérifie automatiquement si l'abréviation fait partie de la liste des enseignants. Si elle ne la trouve pas, elle indique "Inconnue" dans le nom et le prénom, en plus de mettre l'abréviation en rouge.</p> <h3><strong>Sélection de tous les éléments</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/008.png"></p> <p>En haut du corps de la page, juste au-dessus du premier élément de la liste, se trouve une case à cocher supplémentaire. Cette case permet de sélectionner ou de désélectionner tous les missions.</p> </div></div>`; let content5 = `<div class="p-4 bg-white rounded shadow text-black"> <div class="prose max-w-none"> <h2><strong>Onglet Notes</strong></h2> <p><strong>Cet onglet permet de gérer les notes</strong>. Lorsque vous cliquez sur le bouton Notes dans le menu à gauche, vous verrez le contenu s'afficher à droite. L'interface de l'onglet Notes est divisée en deux parties : l'<strong>en-tête</strong> et le <strong>corps/contenu</strong>.</p> <p><img alt="Image AxenFlow" src="./site/image/009.png"></p> <hr> <h3><strong>En-tête</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/010.png"></p> <p>L'en-tête de l'onglet Notes contient plusieurs informations essentielles et options d'interaction avec les données :</p> <ul> <li> <p><strong>Le nombre de notes enregistrées</strong> : Indique le nombre total d'évaluations enregistrées dans l'application.</p> </li> <li> <p><strong>Le nombre d'éléments sélectionnés</strong> : Affiche le nombre de notes actuellement sélectionnées via les cases à cocher.</p> </li> <li> <p><strong>Les boutons d'action</strong> :</p> <p><em><strong>Ajouter</strong></em> : Permet d'ajouter une nouvelle note à la fin de la liste. L'ajout ne modifie que l'application et ne touche pas les données des feuilles Excel tant que l'utilisateur ne sauvegarde pas.</p> <p><img alt="Image AxenFlow" src="./site/image/011.png"></p> <p><em><strong>Sauvegarder</strong></em> : Enregistre toutes les modifications effectuées dans l'application vers les feuilles Excel. Une fenêtre de confirmation apparaît pour éviter toute modification accidentelle.</p> <p><img alt="Image AxenFlow" src="./site/image/012.png"></p> <p><em><strong>Supprimer</strong></em> : Supprime les notes sélectionnées à l'aide des cases à cocher. La suppression n'est appliquée que dans l'application tant que le bouton Sauvegarder n'a pas été utilisé. Une fois la sauvegarde effectuée, les suppressions sont appliquées aux feuilles Excel.</p> <p><img alt="Image AxenFlow" src="./site/image/013.png"></p> </li> </ul> <h3><strong>Corps / Contenu</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/014.png"></p> <p>Le corps de l'onglet Notes présente plusieurs champs permettant de structurer et d'afficher les informations des évaluations.</p> <ul> <li> <p><strong>Zones de saisie</strong> :</p> <p><em><strong>Case à cocher</strong></em> : Chaque ligne de note est accompagnée d'une case permettant de la sélectionner pour des actions comme la suppression.</p> <p><em><strong>Matricule</strong></em> : Identifiant unique de l'élève concerné.</p> <p><em><strong>Nom</strong></em> : Nom de l'élève.</p> <p><em><strong>Prénom</strong></em> : Prénom de l'élève.</p> <p><em><strong>Classe</strong></em> : Classe de l'élève.</p> <p><em><strong>Notes</strong></em> : Bouton permettant d'afficher la ligne de notes de l'élève dans la feuille.</p> <p><img alt="Image AxenFlow" src="./site/image/015.png"></p> </li> <li> <p><strong>Barre de défilement</strong> : Une barre de défilement permet de naviguer dans la liste des notes lorsque celle-ci devient trop longue pour être affichée en une seule fois.</p> </li> </ul> <h3><strong>Vérification des données</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/016.png"></p> <p>L'application vérifie automatiquement si le matricule fait partie de la liste des élèves. Si elle ne le trouve pas, elle indique "Inconnue" dans le nom et le prénom, en plus de mettre le matricule en rouge.</p> <h3><strong>Sélection de tous les éléments</strong></h3> <p><img alt="Image AxenFlow" src="./site/image/017.png"></p> <p>Une case à cocher située en haut de la liste permet de tout sélectionner ou tout désélectionner en un seul clic.</p> </div></div>`; let content6 = `<div class="p-5 bg-white rounded shadow text-black"> <div class="prose max-w-none"> <h2> <strong>Onglet Email</strong> </h2> <p> <strong>Cet onglet permet de configurer et d'envoyer des e-mails</strong>. L'interface de l'onglet Email est divisée en deux parties : l'<strong>en-tête</strong> et le <strong>corps/contenu</strong>. </p> <p> <img alt="Image AxenFlow" src="./site/image/018.png"> </p> <hr> <h3> <strong>En-tête</strong> </h3> <p> <img alt="Image AxenFlow" src="./site/image/019.png"> </p> <p> Dans l'en-tête, vous pouvez sélectionner le mode d'envoi des e-mails, avec plusieurs options : Relevé de notes, Programme annuel de l'étudiant, Attribution. Ces options déterminent le type de contenu que vous souhaitez envoyer à vos destinataires.</p> <h3> <strong>Corps / Contenu</strong> </h3> <p> Le corps de l'onglet Email contient plusieurs sections essentielles pour configurer le contenu des e-mails à envoyer.</p> <p> <strong>1. Le "À"</strong> </p> <p> Le champ "À" contient le patron d'adresse e-mail à envoyer. Ce champ est automatiquement géré par l'application et n'est pas modifiable.</p> <p> <strong>2. L'objet du mail</strong> </p> <p> L'objet de l'e-mail. Il prend en compte éléments dynamiques comme <em><strong>[Nom]</strong></em>, <em><strong>[Prénom]</strong></em> et <em><strong>[Année]</strong></em>. Ces éléments seront automatiquement remplacés par les véritables valeurs lorsque l'application enverra les e-mails. </p> <p> <strong>3. Le contenu de l'email</strong> </p> <p>Le corps de l'email. Il prend en compte éléments dynamiques comme <em><strong>[Nom]</strong></em>, <em><strong>[Prénom]</strong></em>, <em><strong>[Année]</strong></em> et pour la catégorie Attribution, l'élément <em><strong>[Missions]</strong></em> sera également intégré dans le contenu de l'email. </p> <p> <img alt="Image AxenFlow" src="./site/image/020.png"> </p> <p> <strong>4. Options d'email</strong> </p> <p>L'option de type de Email vous permet de choisir entre deux formats d'email :</p> <ul> <li>Texte brut (sans mise en forme)</li> <li>Contenu formaté (avec mise en forme) <img alt="Image AxenFlow" src="./site/image/021.png"> </li> </ul> <p> <strong>5. Nom du fichier</strong> Le nom du fichier. Il peut inclure des éléments dynamiques comme <em><strong>[Nom]</strong></em>, <em><strong>[Prénom]</strong></em> et <em><strong>[Classe]</strong></em>. </p> <p> <strong>6. Format du fichier</strong> Choisissez si les fichiers doivent être au format PDF ou XLSX. </p> <p> <strong>7. Emplacement des fichiers</strong> Vous pouvez définir le dossier où les fichiers seront stockés (par défaut, dans le dossier Projet2025 sur le bureau). </p> <p> <strong>8. Sélection des informations</strong> Cette option vous permet de choisir si vous souhaitez inclure toutes les informations ou uniquement le minimum (en excluant les données vides). </p> <p> <img alt="Image AxenFlow" src="./site/image/022.png"> </p> <p> <strong>9. Mode d'envoi</strong> </p> <p> Vous avez deux choix pour l'envoi des e-mails :</p> <ul> <li> <em><strong>Envoyer à tous</strong></em> : Créer un fichier et envoyer un e-mail à toutes les personnes ayant accès aux informations dans les feuilles de données. </li> <li> <em><strong>Envoyer aux sélectionnés</strong></em> : Créer un fichier et envoyer un e-mail uniquement aux personnes sélectionnées via les cases à cocher présentes sur les différentes pages. </li> </ul> <p> <strong>10. Création de fichier</strong> </p> <p>Vous pouvez choisir entre deux méthodes pour gérer la création des fichiers :</p> <ul> <li> <p><em><strong>Manuelle</strong></em> : Gérer tous les fichiers manuellement avant de les envoyer.</p> <p><img alt="Image AxenFlow" src="./site/image/023.png"></p> </li> <li> <p><em><strong>Automatique</strong></em> : Créer tous les fichiers automatiquement sans intervention manuelle.</p> <p><img alt="Image AxenFlow" src="./site/image/024.png"></p> </li> </ul> <p> <strong>11. Boutons d'Action</strong> </p> <p> <img alt="Image AxenFlow" src="./site/image/025.png"> </p> <p> En bas de l'interface, vous trouverez 5 boutons pour gérer vos e-mails et fichiers :</p> <ul> <li> <p><em><strong>Vider</strong></em> : Supprime toutes les informations saisies dans les formulaires.</p> </li> <li> <p><em><strong>Importer</strong></em> : Permet de préremplir tous les champs depuis un fichier exporté par l'application.</p> </li> <li> <p><em><strong>Exporter</strong></em> : Permet d'exporter un fichier à remplir pour une utilisation future.</p> </li> <li> <p><em><strong>Prévisualiser</strong></em> : Permet de visualiser un e-mail de test sans l'envoyer, pour voir à quoi ressemblera l'e-mail final.</p> <p><img alt="Image AxenFlow" src="./site/image/026.png"></p> </li> <li> <p><em><strong>Envoyer</strong></em> : Crée et envoie les e-mails selon les configurations définies dans les sections précédentes.</p> </li> </ul> <h3> <strong>Barre de progression lors de l'envoi</strong> </h3> <p> Lorsque vous cliquez sur le bouton Envoyer, une barre de progression s'affiche. Cette barre vous permet de suivre en temps réel l'avancement de l'envoi des e-mails et des créations de fichiers. Elle indique clairement les étapes que le programme est en train d'effectuer, vous permettant ainsi de savoir où en est le processus.</p> <p> <img alt="Image AxenFlow" src="./site/image/027.png"> </p> </div></div>`; switch (contentNumber) { case 1: document.getElementById("contentDynamic").innerHTML = content1; break; case 2: document.getElementById("contentDynamic").innerHTML = content2; break; case 3: document.getElementById("contentDynamic").innerHTML = content3; break; case 4: document.getElementById("contentDynamic").innerHTML = content4; break; case 5: document.getElementById("contentDynamic").innerHTML = content5; break; case 6: document.getElementById("contentDynamic").innerHTML = content6; break; case 7: window.open('https://github.com/xen0r-star/AxenFlow/blob/main/LICENSE', '_blank'); break; default: document.getElementById("contentDynamic").innerHTML = content1; break; } } showContent(1); </script></body></html>
